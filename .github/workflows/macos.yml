name: macOS

# Runs the shared dictionary contract against the Swift implementation. The Windows
# workflow runs the identical vectors against the C# one. Both must be green for the two
# implementations to be considered in agreement — that pairing is the whole point.

on:
  push:
    branches: [main]
    paths: ['Sources/**', 'Tests/**', 'shared/**', 'Package.swift', '.github/workflows/macos.yml']
  pull_request:
    paths: ['Sources/**', 'Tests/**', 'shared/**', 'Package.swift', '.github/workflows/macos.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dictionary-contract:
    name: Dictionary contract
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Package.swift declares swift-tools-version 6.2, but the runner defaults to an
      # older Xcode (Swift 6.1) and fails to even parse the manifest. Select the newest
      # Xcode present rather than pinning a version that will age out of the image.
      - name: Select the newest Xcode
        run: |
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $latest"
          sudo xcode-select -s "$latest/Contents/Developer"

      - name: Swift version
        run: swift --version

      # The app target needs macOS 26 and the Speech framework, which the runner image does
      # not have. The library targets are deliberately platform-neutral, so they — and the
      # contract that matters here — build and test anywhere.
      #
      # Deliberately unfiltered. This previously ran `--filter VectorTests`, which silently
      # meant every suite added afterwards was compiled and then never executed: the
      # vocabulary learner's 18 tests went green for two merges without a single assertion
      # being run. A filter here has to be maintained in lockstep with the test targets, and
      # failing open is exactly the wrong direction for a gate.
      - name: Test the library targets
        run: swift test

      - name: Confirm the vectors on both sides are identical
        run: |
          if ! diff -q shared/dictionary-test-vectors.json Tests/MurmurDictionaryTests/dictionary-test-vectors.json; then
            echo "::error::The Swift test copy of the vectors has drifted from shared/."
            echo "Run: cp shared/dictionary-test-vectors.json Tests/MurmurDictionaryTests/"
            exit 1
          fi
          echo "Vectors match."
